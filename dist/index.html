<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f1f3f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <title>今日信息差</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f1f3f2;
      --paper:#ffffff;
      --ink:#111513;
      --muted:#59615d;
      --line:#cfd5d1;
      --soft:#e7ebe8;
      --accent:#087f5b;
      --accent-ink:#066447;
      --accent-soft:#dff1e9;
      --signal:#d9472f;
      --warn:#9a5d00;
      --shadow:0 18px 55px rgba(18,30,24,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#111513;
        --paper:#181d1a;
        --ink:#edf2ee;
        --muted:#aab5af;
        --line:#364039;
        --soft:#232a26;
        --accent:#59d2a4;
        --accent-ink:#79e2b9;
        --accent-soft:#173a2c;
        --signal:#ff7a65;
        --warn:#f0b45c;
        --shadow:0 18px 55px rgba(0,0,0,.22);
      }
    }
    *{box-sizing:border-box}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Noto Sans SC","PingFang SC",sans-serif;
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    button{font:inherit}
    .page{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:30px 0 80px}
    .mast{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:24px;
      align-items:end;
      border-top:7px solid var(--ink);
      border-bottom:1px solid var(--ink);
      padding:18px 0 20px;
    }
    .edition{display:flex;gap:10px;align-items:center;color:var(--accent-ink);font-weight:800;font-size:.8rem;letter-spacing:.08em}
    .edition::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 18%,transparent)}
    h1{margin:12px 0 6px;font-family:"Noto Serif SC",serif;font-size:clamp(2.3rem,5.2vw,5rem);line-height:1.06;letter-spacing:-.055em;max-width:840px}
    .dek{margin:0;color:var(--muted);font-size:1.03rem;max-width:750px}
    .stamp{text-align:right;white-space:nowrap;color:var(--muted);font-size:.82rem;line-height:1.7}
    .stamp strong{display:block;color:var(--ink);font-size:1.06rem}

    .archive-bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:14px 16px;
      background:var(--ink);
      color:var(--bg);
      border-top:7px solid var(--ink);
    }
    @media (prefers-color-scheme: dark){.archive-bar{background:#edf2ee;color:#111513;border-top-color:#edf2ee}}
    .archive-copy{display:flex;align-items:center;gap:10px;min-width:0}
    .archive-copy svg{width:20px;height:20px;flex:0 0 auto}
    .archive-copy strong{display:block;font-size:.88rem;line-height:1.2}
    .archive-copy span{display:block;font-size:.72rem;opacity:.68;margin-top:3px}
    .archive-select-wrap{position:relative;flex:0 0 auto}
    .archive-select{
      appearance:none;
      min-width:190px;
      border:1px solid color-mix(in srgb,currentColor 35%,transparent);
      border-radius:0;
      background:transparent;
      color:currentColor;
      font:700 .86rem "Noto Sans SC","PingFang SC",sans-serif;
      padding:9px 36px 9px 12px;
      cursor:pointer;
    }
    .archive-select:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
    .archive-select option{background:var(--paper);color:var(--ink)}
    .archive-select-wrap::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
    .briefing-edition[hidden]{display:none}

    .market-snapshot{border-bottom:1px solid var(--line)}
    .tape-kicker{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 16px;background:var(--soft);color:var(--muted);font-size:.72rem;font-weight:700}
    .tape-kicker strong{color:var(--ink);font-size:.76rem}
    .tape-kicker a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
    .tape-kicker a:hover{border-color:var(--accent)}
    .tape{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
    .pulse{background:var(--paper);padding:13px 16px;display:flex;align-items:baseline;gap:9px;min-width:0}
    .pulse b{font-family:"Noto Serif SC",serif;font-size:1.3rem}
    .pulse span{font-size:.78rem;color:var(--muted)}
    .rmb-tape .pulse{background:color-mix(in srgb,var(--accent-soft) 48%,var(--paper))}
    .rmb-tape .pulse b{color:var(--ink);white-space:nowrap}
    .basis-tape .pulse{align-items:flex-start}
    .basis-tape .pulse b{font-family:"Noto Sans SC","PingFang SC",sans-serif;font-size:1rem;white-space:nowrap}
    .pulse-detail{display:flex;flex-direction:column;gap:2px;line-height:1.45}
    .pulse-detail small{font-size:.68rem;color:var(--muted)}
    .up,.pulse span .up{color:var(--signal)} .down,.pulse span .down{color:var(--accent-ink)}

    .toolbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 91%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 calc((100vw - 100%)/-2);padding:12px max(20px,calc((100vw - min(1240px,calc(100% - 40px)))/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
    .filters{display:flex;gap:6px;flex-wrap:wrap}
    .filter,.mode{
      border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.82rem;font-weight:700;transition:.18s ease;
    }
    .filter:hover,.mode:hover{background:var(--soft);color:var(--ink)}
    .filter.active{background:var(--ink);color:var(--bg)}
    .mode{border-color:var(--line);color:var(--ink);white-space:nowrap}
    .mode svg{width:14px;vertical-align:-2px;margin-right:5px}

    .lead-grid{display:grid;grid-template-columns:355px minmax(0,1fr);gap:30px;margin-top:34px;align-items:start}
    .insights{position:sticky;top:78px}
    .section-label{font-size:.78rem;font-weight:800;letter-spacing:.1em;color:var(--accent-ink);display:flex;align-items:center;gap:10px;margin:0 0 12px}
    .section-label::after{content:"";height:1px;background:var(--line);flex:1}
    .insight-stack{background:var(--ink);color:var(--bg);padding:24px 24px 10px;box-shadow:var(--shadow)}
    @media (prefers-color-scheme: dark){.insight-stack{background:#edf2ee;color:#111513}}
    .insight{padding:0 0 20px;margin:0 0 20px;border-bottom:1px solid color-mix(in srgb,currentColor 22%,transparent)}
    .insight:last-child{border:0;margin-bottom:0}
    .insight-num{font-size:.72rem;font-weight:800;opacity:.6}
    .insight h2{font-family:"Noto Serif SC",serif;font-size:1.25rem;line-height:1.45;margin:5px 0 8px}
    .insight p{font-size:.86rem;line-height:1.65;margin:0;opacity:.78}
    .watch{margin-top:20px;border:1px solid var(--line);padding:18px;background:var(--paper)}
    .watch h3{font-size:.86rem;margin:0 0 10px}
    .watch ul{list-style:none;padding:0;margin:0}
    .watch li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--soft);font-size:.8rem;color:var(--muted)}
    .watch strong{color:var(--ink)}

    .feed{min-width:0}
    .category{margin-bottom:38px;scroll-margin-top:90px}
    .category-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:0}
    .category-head h2{font-family:"Noto Serif SC",serif;font-size:1.45rem;margin:0}
    .category-head span{font-size:.75rem;color:var(--muted);font-weight:700}
    .story{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}
    .story[hidden],.category[hidden]{display:none}
    .num{font-family:"Noto Serif SC",serif;font-size:2.1rem;line-height:1;color:var(--line);font-weight:900;padding-top:4px}
    .story.priority .num{color:var(--signal)}
    .story h3{font-family:"Noto Serif SC",serif;font-size:1.13rem;line-height:1.6;margin:0 0 9px;letter-spacing:-.015em}
    .story h3 .mark{background:linear-gradient(transparent 62%,var(--accent-soft) 0)}
    .why{margin:0;color:var(--muted);font-size:.91rem}
    .why strong{color:var(--accent-ink);font-size:.78rem;margin-right:6px}
    .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px;font-size:.75rem;color:var(--muted)}
    .source{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--accent-ink);font-weight:700;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
    .source:hover{border-color:var(--accent)}
    .source svg{width:12px;height:12px}
    .dot{opacity:.45}
    .caveat{display:inline-flex;align-items:center;color:var(--warn);font-weight:700}
    body.compact .why{display:none}
    body.compact .story{padding:15px 0}
    body.compact .story h3{margin-bottom:5px;font-size:1.02rem}
    body.compact .meta{margin-top:7px}

    .boundary{margin-top:18px;padding-top:24px;border-top:7px solid var(--ink);display:grid;grid-template-columns:220px 1fr;gap:28px}
    .boundary h2{font-family:"Noto Serif SC",serif;font-size:1.5rem;margin:0}
    .boundary-list{display:grid;gap:12px}
    .boundary-item{background:var(--paper);padding:15px 18px;border-left:3px solid var(--warn);font-size:.86rem;color:var(--muted)}
    .boundary-item strong{color:var(--ink)}
    .foot{display:flex;justify-content:space-between;gap:20px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:.74rem;color:var(--muted)}
    .empty{display:none;padding:50px 0;text-align:center;color:var(--muted)}

    @media (max-width:900px){
      .lead-grid{grid-template-columns:1fr}
      .insights{position:static;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}
      .watch{margin-top:0}
    }
    @media (max-width:680px){
      .page{width:min(100% - 28px,1240px);padding-top:16px}
      .archive-bar{align-items:stretch;flex-direction:column;gap:11px;padding:13px 14px 15px}
      .archive-select-wrap,.archive-select{width:100%}
      .archive-select{min-width:0;padding-top:10px;padding-bottom:10px}
      .mast{grid-template-columns:1fr;padding-top:14px}
      h1{font-size:2.55rem;letter-spacing:-.05em}
      .stamp{text-align:left;display:flex;gap:10px;align-items:center;white-space:normal}
      .stamp strong{display:inline}
      .tape-kicker{align-items:flex-start;flex-direction:column;gap:2px;padding:8px 14px}
      .tape{grid-template-columns:1fr}
      .toolbar{padding:10px 14px;align-items:flex-start}
      .filters{gap:4px}
      .filter{padding:6px 9px;font-size:.76rem}
      .mode{font-size:0;padding:7px 9px}
      .mode svg{margin:0;width:16px;height:16px}
      .lead-grid{margin-top:24px;gap:26px}
      .insights{grid-template-columns:1fr}
      .insight-stack{padding:20px 20px 4px}
      .watch{display:none}
      .story{grid-template-columns:38px minmax(0,1fr);gap:10px;padding:18px 0}
      .num{font-size:1.5rem}
      .story h3{font-size:1.04rem;line-height:1.55}
      .why{font-size:.86rem}
      .category-head h2{font-size:1.25rem}
      .boundary{grid-template-columns:1fr;gap:14px}
      .foot{flex-direction:column;gap:6px}
    }
    @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.filter,.mode{transition:none}}


</style>
</head>

    var items = t.items.map(function (it) {
      return '<div class="pulse"><b class="' + dirClass(it.dir) + '">' + esc(it.value) + '</b>' +
        '<span>' + esc(it.unit) + '　<span class="' + dirClass(it.changeDir || it.dir) + '">' + esc(it.change) + '</span></span></div>';
    }).join('');
    return '<div class="tape-kicker"><strong>' + esc(t.title) + '</strong><span>' + esc(t.note || '') + '</span></div>' +
      '<div class="tape">' + items + '</div>';
  }

  function renderChinaTape(t) {
    var items = t.items.map(function (it) {
      var v = '<b' + (it.dir ? ' class="' + dirClass(it.dir) + '"' : '') + '>' + esc(it.value) + '</b>';
      var detail = '<span class="pulse-detail"><span>' + esc(it.label) +
        (it.change ? '　<span class="' + dirClass(it.changeDir) + '">' + esc(it.change) + '</span>' : '') + '</span>' +
        (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span>';
      return '<div class="pulse">' + v + detail + '</div>';
    }).join('');
    return '<div class="tape-kicker"><strong>' + esc(t.title) + '</strong><span>' + (t.noteHtml || '') + '</span></div>' +
      '<div class="tape rmb-tape">' + items + '</div>';
  }

  function renderFxTape(t) {
    var formula = '<div class="pulse"><b>' + esc(t.formulaLabel || '换算口径') + '</b>' +
      '<span class="pulse-detail"><span>' + esc(t.formula) + '</span>' +
      (t.formulaNote ? '<small>' + esc(t.formulaNote) + '</small>' : '') + '</span></div>';
    var items = t.items.map(function (it) {
      return '<div class="pulse"><b class="' + dirClass(it.dir) + '">' + esc(it.value) + '</b>' +
        '<span class="pulse-detail"><span>' + esc(it.label) + '</span>' +
        (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span></div>';
    }).join('');
    return '<div class="tape-kicker"><strong>' + esc(t.title) + '</strong><span>' + (t.noteHtml || '') + '</span></div>' +
      '<div class="tape basis-tape">' + formula + items + '</div>';
  }

  function renderMarket(m) {
    return '<section class="market-snapshot" aria-label="市场早盘快照">' +
      renderIntlTape(m.intl) + renderChinaTape(m.china) + renderFxTape(m.fx) + '</section>';
  }

  function renderInsights(d) {
    var insights = d.insights.map(function (it) {
      return '<article class="insight"><div class="insight-num">' + esc(it.num) + '</div>' +
        '<h2>' + esc(it.title) + '</h2><p>' + esc(it.text) + '</p></article>';
    }).join('');
    var watch = (d.watch || []).map(function (w) {
      return '<li><span>' + esc(w.date) + '</span><strong>' + esc(w.event) + '</strong></li>';
    }).join('');
    return '<aside class="insights" aria-label="三条核心洞察"><div>' +
      '<div class="section-label">一句话洞察 × 3</div>' +
      '<div class="insight-stack">' + insights + '</div></div>' +
      (watch ? '<div class="watch"><h3>接下来盯什么</h3><ul>' + watch + '</ul></div>' : '') + '</aside>';
  }

  function renderSource(s) {
    return '<a class="source" href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
      esc(s.name) + ' ' + DIR_ARROW + '</a>';
  }

  function renderStory(st) {
    var meta = st.sources.map(renderSource).join('<span class="dot">·</span>') +
      '<span class="dot">·</span><span>' + esc(st.date) + '</span>' +
      (st.caveats || []).map(function (c) { return '<span class="caveat">' + esc(c) + '</span>'; }).join('');
    return '<article class="story' + (st.priority ? ' priority' : '') + '" data-category="' + esc(st.category) + '">' +
      '<div class="num">' + esc(st.num) + '</div><div>' +
      '<h3>' + st.titleHtml + '</h3>' +
      '<p class="why"><strong>为什么重要</strong>' + esc(st.why) + '</p>' +
      '<div class="meta">' + meta + '</div></div></article>';
  }

  function renderFeed(d) {
    var cats = d.categories.map(function (c) {
      var stories = c.stories.map(function (st) {
        st.category = c.id;
        return renderStory(st);
      }).join('');
      return '<section class="category" data-category="' + esc(c.id) + '" id="cat-' + esc(d.date) + '-' + esc(c.id) + '">' +
        '<div class="category-head"><h2>' + esc(c.title) + '</h2><span>' + c.stories.length + ' 条</span></div>' +
        stories + '</section>';
    }).join('');
    return '<main class="feed">' + cats + '<div class="empty">该分类暂无条目。</div></main>';
  }

  function renderToolbar(d) {
    var total = d.categories.reduce(function (n, c) { return n + c.stories.length; }, 0);
    var btns = '<button class="filter active" data-filter="all" aria-pressed="true">全部 ' + total + '</button>' +
      d.categories.map(function (c) {
        return '<button class="filter" data-filter="' + esc(c.id) + '" aria-pressed="false">' +
          esc(c.filterName) + ' ' + c.stories.length + '</button>';
      }).join('');
    return '<nav class="toolbar" aria-label="简报筛选"><div class="filters">' + btns + '</div>' +
      '<button class="mode" aria-pressed="false" title="切换精简阅读">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>' +
      '<span>精简阅读</span></button></nav>';
  }

  function renderBoundary(d) {
    if (!d.boundary || !d.boundary.length) return '';
    var items = d.boundary.map(function (b) {
      return '<div class="boundary-item">' + b + '</div>';
    }).join('');
    return '<section class="boundary" aria-labelledby="boundary-title-' + esc(d.date) + '">' +
      '<h2 id="boundary-title-' + esc(d.date) + '">核验边界</h2>' +
      '<div class="boundary-list">' + items + '</div></section>';
  }

  function renderEdition(d) {
    return '<article class="briefing-edition" data-edition="' + esc(d.date) + '" data-label="' + esc(d.label) + '">' +
      '<header class="mast"><div>' +
      '<div class="edition">' + esc(d.editionLine) + '</div>' +
      '<h1>' + d.headlineHtml + '</h1>' +
      '<p class="dek">' + esc(d.dek) + '</p></div>' +
      '<div class="stamp"><strong>' + esc(d.stamp.time) + '</strong><span>' + esc(d.stamp.note) + '</span></div>' +
      '</header>' +
      renderMarket(d.market) + renderToolbar(d) +
      '<div class="lead-grid">' + renderInsights(d) + renderFeed(d) + '</div>' +
      renderBoundary(d) +
      '<footer class="foot"><span>' + esc(d.footer.left) + '</span><span>' + esc(d.footer.right) + '</span></footer>' +
      '</article>';
  }

  /* ---------- 交互 ---------- */

  function wireEdition(article) {
    article.querySelectorAll('.filter').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var selected = btn.getAttribute('data-filter');
        article.querySelectorAll('.filter').forEach(function (b) {
          var active = b === btn;
          b.classList.toggle('active', active);
          b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        article.querySelectorAll('.category').forEach(function (section) {
          section.hidden = selected !== 'all' && section.getAttribute('data-category') !== selected;
        });
        var grid = article.querySelector('.lead-grid');
        if (grid) window.scrollTo({ top: grid.offsetTop - 62, behavior: 'smooth' });
      });
    });
    article.querySelectorAll('.mode').forEach(function (modeBtn) {
      modeBtn.addEventListener('click', function () {
        var compact = document.body.classList.toggle('compact');
        document.querySelectorAll('.mode').forEach(function (button) {
          button.setAttribute('aria-pressed', compact ? 'true' : 'false');
          button.querySelector('span').textContent = compact ? '展开解读' : '精简阅读';
        });
      });
    });
  }

  function mount(editions) {
    editions.sort(function (a, b) { return b.date.localeCompare(a.date); });
    editions = editions.slice(0, ARCHIVE_LIMIT);

    var host = document.getElementById('editions');
    host.innerHTML = editions.map(renderEdition).join('');
    var articles = Array.prototype.slice.call(host.querySelectorAll('.briefing-edition'));
    articles.forEach(wireEdition);

    var select = document.getElementById('archiveSelect');
    var count = document.getElementById('archiveCount');
    articles.forEach(function (article, index) {
      var option = document.createElement('option');
      option.value = article.getAttribute('data-edition');
      option.textContent = article.getAttribute('data-label') + (index === 0 ? ' · 最新一期' : '');
      select.appendChild(option);
      article.hidden = index !== 0;
    });
    count.textContent = '最近 30 天 · 当前 ' + articles.length + ' 期';
    if (articles.length) select.value = articles[0].getAttribute('data-edition');

    select.addEventListener('change', function () {
      articles.forEach(function (article) {
        article.hidden = article.getAttribute('data-edition') !== select.value;
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  /* ---------- 数据加载 ---------- */

  function fail(msg) {
    document.getElementById('editions').innerHTML =
      '<p style="padding:60px 20px;text-align:center;color:#888">' + esc(msg) + '</p>';
  }

  if (window.__EDITIONS__) {
    mount(window.__EDITIONS__);
  } else {
    fetch('data/manifest.json').then(function (r) {
      if (!r.ok) throw new Error('manifest');
      return r.json();
    }).then(function (manifest) {
      var dates = (manifest.editions || []).slice(0, ARCHIVE_LIMIT);
      return Promise.all(dates.map(function (date) {
        return fetch('data/editions/' + date + '.json').then(function (r) {
          if (!r.ok) throw new Error(date);
          return r.json();
        });
      }));
    }).then(mount).catch(function () {
      fail('简报数据加载失败，请检查 data/ 目录是否完整，或使用单文件版本部署。');
    });
  }
})();

</script>
</body>
</html>
